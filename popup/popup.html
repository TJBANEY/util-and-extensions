<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Card Deal Scout — Deal Digest</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="22" height="22">
    <div class="ttl">Deal Digest</div>
    <div id="site" class="site"></div>
    <button id="btnOptions" class="icon" title="Options">⚙</button>
  </header>

  <section id="unsupported" class="hidden">
    <p id="unsupportedMsg">Card Deal Scout isn't running on this page.</p>
    <button id="btnEnable" class="primary">Enable on this site</button>
    <p class="muted small">Works out of the box on Mercari and eBay. On other sites it analyses the page layout heuristically — results vary.</p>
  </section>

  <section id="main" class="hidden">
    <div class="chips" id="chips"></div>
    <div class="toolbar">
      <select id="sort">
        <option value="ratio">Best deal first</option>
        <option value="savings">Biggest $ savings</option>
        <option value="price">Lowest price</option>
        <option value="flip">Best flip net</option>
      </select>
      <label class="chk"><input type="checkbox" id="hideSeen"> hide seen</label>
      <button id="btnRescan" class="icon" title="Rescan page">↻</button>
    </div>
    <ul id="list"></ul>
    <div class="bottom">
      <button id="btnOpenSteals" class="primary">Open all steals</button>
      <button id="btnCsv">Export CSV</button>
    </div>
  </section>

  <footer id="status"></footer>
  <script src="../lib/storage.js"></script>
  <script src="../lib/deal-scorer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
