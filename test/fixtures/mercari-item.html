<!doctype html>
<html><head><meta charset="utf-8"><title>Rocket's Suicune (fixture)</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#333}
.wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;max-width:1100px;margin:0 auto;padding:24px}
.photo{aspect-ratio:1/1;background:linear-gradient(135deg,#fde68a,#fca5a5);border-radius:12px}
h1{font-size:20px;margin:0 0 6px}
[data-testid=ItemPrice]{font-size:26px;font-weight:800}
.btn{display:inline-block;padding:10px 16px;border-radius:8px;background:#111;color:#fff;margin:14px 8px 0 0}
.spec{margin-top:24px;color:#555;font-size:14px}
</style></head>
<body>
<div class="wrap">
  <div class="photo"></div>
  <div data-testid="ItemInfo">
    <h1 data-testid="ItemName">ARS 4 2001 Pokemon TCG Rocket's Suicune Pokemon VS #096/141 Holo Japanese 1st</h1>
    <div data-testid="ItemMetaText">Like New | Pokemon</div>
    <div data-testid="ItemPriceLabelRow"><span data-testid="ItemPrice">$250.00</span> <span data-testid="ItemDetailPriceSummaryHeadline">+$0.50 Buyer Protection</span></div>
    <div><span class="btn" data-testid="MakeOfferButton_">Make offer</span><span class="btn" data-testid="BuyNowButton">Buy now</span></div>
    <div class="spec">
      <div data-testid="ItemDetailsCondition">Like new</div>
      <div data-testid="SellerRatingCount">657</div>
      <p data-testid="ItemDetailsDescription">Graded ARS 4. Light whitening on the back, see pics. Ships in a sleeve + toploader.</p>
    </div>
  </div>
</div>
</body></html>
